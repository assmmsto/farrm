<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Amiri";
    src: url("fonts/Amiri-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #F3EFE4;
  }
  .card {
    width: 1200px;
    height: 630px;
    background: url("card-art.jpg") center / cover no-repeat;
    position: relative;
  }
  .lockup {
    position: absolute;
    left: 0;
    right: 0;
    top: 86px;
    text-align: center;
    color: #1C2822;
    font-family: "Amiri", serif;
    font-weight: 700;
    direction: rtl;
  }
  .name {
    display: inline-block;
    font-size: 176px;
    line-height: 1;
    white-space: nowrap;
  }
  .rule {
    width: 84px;
    height: 3px;
    margin: 18px auto 0;
    background: #8A5A12;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lockup" id="lock">
      <div class="name" id="name">مختبر الصيدلي</div>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
